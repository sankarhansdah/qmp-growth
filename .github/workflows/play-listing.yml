name: Play listing
on:
  pull_request:
    paths: ["fastlane/metadata/**"]
  push:
    branches: [main]
    paths: ["fastlane/metadata/**"]

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: gem install fastlane
      - name: Validate lengths (PRs and main)
        run: fastlane android validate_listing
      - name: Upload listing (main only)
        if: github.event_name == 'push'
        env:
          PLAY_PACKAGE_NAME: ${{ secrets.PLAY_PACKAGE_NAME }}
          PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_JSON_KEY" > play-service-account.json
          fastlane android push_listing
          rm -f play-service-account.json
